# Builds the macOS app and attaches it to the run as a downloadable artifact,
# so a fix can be built on GitHub without a local Xcode install.
name: App artifact

on:
  workflow_dispatch:
  push:
    branches: [main, mic-fix]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Wake.xcodeproj -scheme Wake -configuration Debug \
            -derivedDataPath build/DerivedData build 2>&1 | tee build.log | tail -n 20
          if grep -E "^/.*\.swift:[0-9]+:[0-9]+: warning:" build.log; then
            echo "::error::The build has warnings."; exit 1
          fi
      - name: Package the app
        run: |
          APP=$(find build/DerivedData/Build/Products -name "Wake.app" -maxdepth 3 | head -1)
          ditto -c -k --keepParent "$APP" Wake.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Wake.app
          path: Wake.app.zip
          if-no-files-found: error
